# =====================================================
# go_server 本地开发编排
# 用法:
#   docker compose up -d          启动
#   docker compose logs -f app    看 app 日志
#   docker compose down           停掉
#   docker compose down -v        停掉并清数据卷
# =====================================================
version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_server_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 服务
      SERVER_PORT: 8080
      SERVER_MODE: release

      # 数据库
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: "123456"
      DATABASE_DBNAME: go_server
      DATABASE_CHARSET: utf8mb4
      DATABASE_PREFIX: "go_"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "123456"
      REDIS_DB: 0

      # 跨域
      CORS_ALLOWED_ORIGINS: "*"

      # 阿里云 OSS
      # ↓↓↓ 真实密钥请放本地 .env 文件(已被 .gitignore 屏蔽)↓↓↓
      ALIYUN_OSS_ENDPOINT: "oss-cn-chengdu.aliyuncs.com"
      ALIYUN_OSS_ACCESS_KEY_ID: "${ALIYUN_OSS_ACCESS_KEY_ID:-YOUR_ALIYUN_ACCESS_KEY_ID}"
      ALIYUN_OSS_ACCESS_KEY_SECRET: "${ALIYUN_OSS_ACCESS_KEY_SECRET:-YOUR_ALIYUN_ACCESS_KEY_SECRET}"
      ALIYUN_OSS_BUCKET_NAME: "m-dys"
      ALIYUN_OSS_BUCKET_DOMAIN: "https://m-dys.oss-cn-chengdu.aliyuncs.com"

      # 日志
      LOGGER_LEVEL: "info"
      LOGGER_DEV: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - go_server_net

  mysql:
    image: mysql:8.0
    container_name: go_server_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: go_server
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - go_server_net

  redis:
    image: redis:7-alpine
    container_name: go_server_redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "123456"
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - go_server_net

networks:
  go_server_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
