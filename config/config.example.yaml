# =====================================================
# go_server 配置示例
# 复制本文件为 config/config.yaml 后,按需修改
#   cp config/config.example.yaml config/config.yaml
# 真实 config/config.yaml 已被 .gitignore 屏蔽,不会进库
#
# 任何字段都可以被同名环境变量覆盖(优先级 env > yaml)
# 命名规则:全大写 + 下划线分段
#   server.port           -> SERVER_PORT
#   database.password     -> DATABASE_PASSWORD
#   storage.access_key    -> STORAGE_ACCESS_KEY
#
# 敏感字段(access_key / secret_key)用占位符,真实值请放本地 config.yaml
# =====================================================

server:
  port: 8080
  mode: debug

database:
  host: 192.168.186.200
  port: 3306
  user: root
  password: "123456"
  dbname: go_server
  charset: utf8mb4
  prefix: "go_"

redis:
  host: 192.168.186.200
  port: 6379
  password: "123456"
  db: 0

# 跨域白名单(默认 * 兼容老前端;生产请按域名收敛)
# 多个 origin 用逗号分隔,例如:
#   allowed_origins: "http://localhost:5173,https://admin.example.com"
cors:
  allowed_origins: "*"

# =====================================================
# 对象存储(S3 兼容协议,统一一套配置,适用 阿里云 OSS / 腾讯云 COS / 自建 MinIO)
# =====================================================
# 业务侧用途:
#   - 用户头像等图片上传  → 路径前缀 uploads/
#   - 代码包上传(APK/ZIP)→ 路径前缀 code_packages/
#
# provider 选填,只用作日志/监控标签,实际 S3 协议一致:
#   aliyun  → 阿里云 OSS(S3 兼容 endpoint,推荐)
#   tencent → 腾讯云 COS(S3 兼容 endpoint,推荐)
#   minio   → 自建 MinIO / 其他 S3 兼容服务
#   (留空)  → 通用 S3
#
# 阿里云 endpoint 样例:oss-cn-chengdu.aliyuncs.com
# 腾讯云 endpoint 样例:cos.ap-guangzhou.myqcloud.com
# MinIO  样例:127.0.0.1:9000(自建)
#
# 真实密钥请放本地 config/config.yaml(已被 .gitignore 屏蔽)
storage:
  provider: "aliyun"                                  # 标签,日志用
  endpoint: "oss-cn-chengdu.aliyuncs.com"             # S3 兼容 endpoint(不带 https://)
  region: "oss-cn-chengdu"                            # 地域,空则从 endpoint 推断
  access_key: "YOUR_ALIYUN_ACCESS_KEY_ID"             # 阿里云:AccessKey ID
  secret_key: "YOUR_ALIYUN_ACCESS_KEY_SECRET"         # 阿里云:AccessKey Secret
  bucket: "m-dys"                                     # Bucket 名
  use_ssl: true                                       # 是否 HTTPS(线上 true)
  path_style: false                                   # 阿里云/腾讯云是 virtual-host(默认 false)
  bucket_host: "https://m-dys.oss-cn-chengdu.aliyuncs.com"  # 自定义 CDN 域名(可空)
  prefix: ""                                          # 路径前缀,例如 "prod/" 让所有文件落到 prod/ 下

# JumpServer(代码部署模块的同步源)
# 业务项目(business_projects)数据可从这里同步
# 真实 Token 请放本地 config/config.yaml(已被 .gitignore 屏蔽)
# 端点参考:GET {base_url}/api/v1/assets/nodes/children/tree/?assets=0&
jumpserver:
  base_url: "http://118.24.89.187:8081"
  token: "YOUR_JUMPSERVER_TOKEN"
  org_id: "00000000-0000-0000-0000-000000000002"
