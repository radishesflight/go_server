services:
  web:
    image: registry.cn-hangzhou.aliyuncs.com/m-robert/web:1.1.0
    container_name: go_server_web
    restart: unless-stopped
    ports: ["5137:80"]
    depends_on:
      go: { condition: service_healthy }
    networks: [stack]

  go:
    image: registry.cn-hangzhou.aliyuncs.com/m-robert/go_server:1.2.0
    container_name: go_server_app
    restart: unless-stopped
    expose: ["8080"]
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      SERVER_MODE: release
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      DATABASE_DBNAME: ${MYSQL_DBNAME}
      DATABASE_CHARSET: utf8mb4
      DATABASE_PREFIX: ${MYSQL_PREFIX}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: 0
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      # 2026-10-20 同步资产失败的修复:把 JMS 占位 yaml 覆盖掉
      JUMPSERVER_BASE_URL: ${JUMPSERVER_BASE_URL}
      JUMPSERVER_TOKEN: ${JUMPSERVER_TOKEN}
      JUMPSERVER_ORG_ID: ${JUMPSERVER_ORG_ID}
      STORAGE_USE_SSL: "true"
      CORS_ALLOWED_ORIGINS: "*"
      LOGGER_LEVEL: info
      LOGGER_DEV: "false"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [stack]
    healthcheck:
      # POST /api/login 会返业务码 4001/参数错但 HTTP 200,GET 返 404 不行
      test: ["CMD-SHELL", "curl -fsS -X POST http://localhost:8080/api/login -H 'Content-Type: application/json' -d '{}' -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: registry.cn-hangzhou.aliyuncs.com/m-robert/mysql:8.0          # 你已有镜像,免下载
    container_name: go_server_mysql
    restart: unless-stopped
    ports: ["13306:3306"]               # 暴露 host 端口避开宿主机 mysqld 占的 3306,方便宿主机跑 seed
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: ${MYSQL_DBNAME}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [stack]

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/m-robert/redis:6.2.6
    container_name: go_server_redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stack]

networks:
  stack: { driver: bridge }

volumes:
  mysql_data:
  redis_data: